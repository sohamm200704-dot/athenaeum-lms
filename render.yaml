services:
  - type: web
    name: athenaeum-lms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: athenaeum-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "0"

databases:
  - name: athenaeum-db
    plan: free
    databaseName: athenaeum
    user: athenaeum
